services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - crm-db-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
      CRM_ATTACHMENTS_DIR: /data/attachments
      CRM_MAX_UPLOAD_BYTES: "10485760"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Attachment blobs live outside the image so they survive rebuilds.
      - crm-attachments:/data/attachments

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  crm-db-data:
  crm-attachments:
